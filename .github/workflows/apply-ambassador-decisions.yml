name: Apply Ambassador Decisions 2026

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without updating labels or posting comments"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  issues: write

jobs:
  apply-decisions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CSV and prepare decisions
        env:
          CSV_PATH: doc/SC.csv
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          csv_path = Path(os.environ["CSV_PATH"])

          if not csv_path.is_file():
              raise SystemExit(f"CSV file not found: {csv_path}")

          decisions = []
          seen_ids = set()

          with csv_path.open(newline="", encoding="utf-8-sig") as file:
              reader = csv.DictReader(file)
              required_columns = {
                  "Submission ID",
                  "Candidate",
                  "Decision",
              }

              if not reader.fieldnames or not required_columns.issubset(
                  set(reader.fieldnames
              ):
                  raise SystemExit(
                      "CSV must contain these columns: "
                      "Submission ID, Candidate, Decision"
                  )

              for line_number, row in enumerate(reader, start=2):
                  raw_id = (row["Submission ID"] or "").strip()
                  candidate = (row["Candidate"] or "").strip()
                  decision = (row["Decision"] or "").strip().lower()

                  if not raw_id.isdigit() or int(raw_id) < 1:
                      raise SystemExit(
                          f"Invalid Submission ID on line {line_number}: "
                          f"{raw_id!r}"
                      )

                  issue_number = int(raw_id)

                  if issue_number in seen_ids:
                      raise SystemExit(
                          f"Duplicate Submission ID #{issue_number} "
                          f"on line {line_number}"
                      )

                  if not candidate:
                      raise SystemExit(
                          f"Missing candidate name on line {line_number}"
                      )

                  if decision not in {"selected", "not selected"}:
                      raise SystemExit(
                          f"Invalid decision on line {line_number}: "
                          f"{row['Decision']!r}. "
                          "Use Selected or Not Selected."
                      )

                  seen_ids.add(issue_number)
                  decisions.append({
                      "issue_number": issue_number,
                      "candidate": candidate,
                      "decision": decision,
                  })

          if not decisions:
              raise SystemExit("The CSV contains no candidate rows.")

          output_path = Path(os.environ["RUNNER_TEMP"]) / "decisions.json"
          output_path.write_text(
              json.dumps(decisions, ensure_ascii=False),
              encoding="utf-8",
          )

          print(f"Validated {len(decisions)} candidate decisions.")
          PY

      - name: Update nomination issues
        uses: actions/github-script@v7
        env:
          DECISIONS_PATH: ${{ runner.temp }}/decisions.json
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === "true";

            const NOMINATION_LABEL = "ambassador-nomination-2026";
            const REVIEW_LABEL = "review-in-progress";

            const SELECTED_LABEL = "Selected";
            const NOT_SELECTED_LABEL = "Not Selected";

            // Remove these older labels if they are present.
            const OLD_DECISION_LABELS = ["Accepted", "Not Accepted"];

            // Hidden markers help prevent duplicate comments on reruns.
            const SELECTED_MARKER =
              "<!-- ambassador-selected-2026 -->";

            const NOT_SELECTED_MARKER =
              "<!-- ambassador-not-selected-2026 -->";

            const SELECTED_COMMENT = [
              "Congratulations! You have been selected as a 2026 PyTorch Foundation Ambassador.",
              "",
              "You will receive an email with details about the next steps and onboarding process.",
              "",
              "Thank you for contributing to the PyTorch Foundation community!",
              "",
              SELECTED_MARKER
            ].join("\n");

            const NOT_SELECTED_COMMENT = [
              "Thank you for your interest in the 2026 PyTorch Foundation Ambassador Program and for the time you took to submit your nomination.",
              "",
              "We sincerely appreciate your contributions to the PyTorch Foundation community. While you were not selected for this year’s Ambassador Program, we value your involvement and encourage you to stay connected and explore other ways to get involved with the PyTorch Foundation community: [Get involved](https://pytorch.org/new/).",
              "",
              NOT_SELECTED_MARKER
            ].join("\n");

            const decisions = JSON.parse(
              fs.readFileSync(process.env.DECISIONS_PATH, "utf8")
            );

            core.info(`Dry run: ${dryRun}`);
            core.info(`CSV contains ${decisions.length} decisions.`);

            // Verify that both new labels exist before changing issues.
            const repositoryLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );

            const existingLabelNames = new Set(
              repositoryLabels.map(label => label.name)
            );

            for (const label of [SELECTED_LABEL, NOT_SELECTED_LABEL]) {
              if (!existingLabelNames.has(label)) {
                throw new Error(
                  `The "${label}" label does not exist. ` +
                  "Create both new labels in GitHub before running this workflow."
                );
              }
            }

            // Validate every CSV issue before changing any issue.
            const issuesToUpdate = [];

            for (const row of decisions) {
              const { issue_number, candidate } = row;

              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number
              });

              if (issue.pull_request) {
                throw new Error(
                  `#${issue_number} is a pull request, not a nomination issue.`
                );
              }

              const labels = issue.labels.map(label =>
                typeof label === "string" ? label : label.name
              );

              if (!labels.includes(NOMINATION_LABEL)) {
                throw new Error(
                  `#${issue_number} does not have the ` +
                  `"${NOMINATION_LABEL}" label. ` +
                  "Check the issue number in your CSV."
                );
              }

              const issueText =
                `${issue.title}\n${issue.body || ""}`.toLowerCase();

              if (!issueText.includes(candidate.toLowerCase())) {
                throw new Error(
                  `#${issue_number}: Candidate "${candidate}" ` +
                  "was not found in the issue title or body. " +
                  "Check that the CSV matches the correct nomination."
                );
              }

              issuesToUpdate.push({ ...row, labels });
            }

            core.info("All nomination issues passed validation.");

            for (const row of issuesToUpdate) {
              const {
                issue_number,
                candidate,
                decision,
                labels
              } = row;

              const isSelected = decision === "selected";

              const targetLabel = isSelected
                ? SELECTED_LABEL
                : NOT_SELECTED_LABEL;

              const oppositeLabel = isSelected
                ? NOT_SELECTED_LABEL
                : SELECTED_LABEL;

              const commentMarker = isSelected
                ? SELECTED_MARKER
                : NOT_SELECTED_MARKER;

              const commentBody = isSelected
                ? SELECTED_COMMENT
                : NOT_SELECTED_COMMENT;

              const labelsToRemove = [
                REVIEW_LABEL,
                oppositeLabel,
                ...OLD_DECISION_LABELS
              ].filter(label => labels.includes(label));

              core.info(
                `Processing #${issue_number} — ${candidate}: ${targetLabel}`
              );

              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              );

              const alreadyCommented = comments.some(comment =>
                comment.body?.includes(commentMarker)
              );

              if (dryRun) {
                if (!labels.includes(targetLabel)) {
                  core.info(
                    `DRY RUN: Would add "${targetLabel}" to #${issue_number}.`
                  );
                }

                for (const label of labelsToRemove) {
                  core.info(
                    `DRY RUN: Would remove "${label}" from #${issue_number}.`
                  );
                }

                if (!labels.includes(REVIEW_LABEL)) {
                  core.info(
                    `DRY RUN: #${issue_number} already has no ` +
                    `"${REVIEW_LABEL}" label.`
                  );
                }

                core.info(
                  alreadyCommented
                    ? `DRY RUN: Decision comment already exists on #${issue_number}; would skip it.`
                    : `DRY RUN: Would post the ${targetLabel} comment on #${issue_number}.`
                );

                continue;
              }

              // Add the new decision label.
              if (!labels.includes(targetLabel)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [targetLabel]
                });

                core.info(
                  `#${issue_number}: Added "${targetLabel}".`
                );
              }

              // Remove review-in-progress, the opposite decision label,
              // and any old Accepted / Not Accepted labels.
              for (const label of labelsToRemove) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: label
                });

                core.info(
                  `#${issue_number}: Removed "${label}".`
                );
              }

              // Post the appropriate decision comment once.
              if (alreadyCommented) {
                core.info(
                  `#${issue_number}: Decision comment already exists. Skipping.`
                );
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: commentBody
                });

                core.info(
                  `#${issue_number}: Posted ${targetLabel} comment.`
                );
              }

              core.info(`#${issue_number}: Finished.`);
            }

            core.info(
              dryRun
                ? `Dry run complete: previewed ${decisions.length} decisions.`
                : `Complete: processed ${decisions.length} decisions.`
            );
