name: Apply 2026 Ambassador Decisions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without updating issues"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  apply-decisions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate selected candidates CSV
        id: decisions
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import sys

          csv_path = "doc/SC.csv"
          required_columns = {"Submission ID", "Candidate", "Decision"}
          selected = []

          try:
              with open(csv_path, newline="", encoding="utf-8-sig") as file:
                  reader = csv.DictReader(file)

                  if not reader.fieldnames or not required_columns.issubset(
                      set(reader.fieldnames)
                  ):
                      sys.exit(
                          "CSV must contain these columns: "
                          "Submission ID, Candidate, Decision"
                      )

                  seen_ids = set()

                  for line_number, row in enumerate(reader, start=2):
                      issue_text = (row["Submission ID"] or "").strip()
                      candidate = (row["Candidate"] or "").strip()
                      decision = (row["Decision"] or "").strip()

                      if not issue_text.isdecimal() or int(issue_text) < 1:
                          sys.exit(
                              f"Line {line_number}: invalid Submission ID "
                              f"{issue_text!r}"
                          )

                      issue_number = int(issue_text)

                      if issue_number in seen_ids:
                          sys.exit(
                              f"Line {line_number}: duplicate issue "
                              f"#{issue_number}"
                          )

                      seen_ids.add(issue_number)

                      if not candidate:
                          sys.exit(
                              f"Line {line_number}: missing candidate name "
                              f"for #{issue_number}"
                          )

                      if decision != "Selected":
                          sys.exit(
                              f"Line {line_number}: expected 'Selected' "
                              f"for #{issue_number}, got {decision!r}. "
                              "This CSV should contain selected candidates only."
                          )

                      selected.append({
                          "issue_number": issue_number,
                          "candidate": candidate,
                      })

          except FileNotFoundError:
              sys.exit(f"Cannot find {csv_path}")

          if len(selected) != 24:
              sys.exit(
                  f"Expected exactly 24 selected candidates, "
                  f"but found {len(selected)}. No issues were changed."
              )

          output_path = os.environ["RUNNER_TEMP"] + "/selected-candidates.json"

          with open(output_path, "w", encoding="utf-8") as file:
              json.dump(selected, file, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write(f"selected_file={output_path}\n")

          print(f"CSV contains {len(selected)} selected candidates.")
          PY

      - name: Preview or apply decisions to open nomination issues
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SELECTED_FILE: ${{ steps.decisions.outputs.selected_file }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = process.env.DRY_RUN === 'true';

            const nominationLabel = 'ambassador-nomination-2026';
            const reviewLabel = 'review-in-progress';

            const selectedComment = [
              '<!-- ambassador-selected-2026 -->',
              'Congratulations! You have been selected as a 2026 PyTorch Foundation Ambassador.',
              '',
              'You will receive an email with details about the next steps and onboarding process.',
              '',
              'Thank you for contributing to the PyTorch Foundation community!'
            ].join('\n');

            const notSelectedComment = [
              '<!-- ambassador-not-selected-2026 -->',
              'Thank you for your interest in the 2026 PyTorch Foundation Ambassador Program and for the time you took to submit your nomination.',
              '',
              'We sincerely appreciate your contributions to the PyTorch Foundation community. While you were not selected for this year’s Ambassador Program, we value your involvement and encourage you to stay connected and explore other ways to get involved with the PyTorch Foundation community: [Get involved](https://pytorch.org/new/).'
            ].join('\n');

            const selectedRows = JSON.parse(
              fs.readFileSync(process.env.SELECTED_FILE, 'utf8')
            );

            const selectedByIssue = new Map(
              selectedRows.map(row => [row.issue_number, row.candidate])
            );

            // Retrieve every OPEN issue with the 2026 nomination label.
            // GitHub's issues endpoint may also return pull requests, so
            // explicitly exclude those.
            const openNominations = (
              await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: nominationLabel,
                per_page: 100
              })
            ).filter(issue => !issue.pull_request);

            const nominationsByNumber = new Map(
              openNominations.map(issue => [issue.number, issue])
            );

            // Validate ALL selected candidates before changing ANY issue.
            // A closed, missing, or incorrectly labeled selected issue
            // stops the entire run.
            const validationErrors = [];

            for (const [issueNumber, candidate] of selectedByIssue) {
              const issue = nominationsByNumber.get(issueNumber);

              if (!issue) {
                validationErrors.push(
                  `Selected candidate ${candidate} (#${issueNumber}) ` +
                  'is not an open issue with the nomination label.'
                );
                continue;
              }

              const issueText = `${issue.title || ''}\n${issue.body || ''}`
                .normalize('NFKC')
                .toLocaleLowerCase();

              const candidateText = candidate
                .normalize('NFKC')
                .toLocaleLowerCase();

              if (!issueText.includes(candidateText)) {
                validationErrors.push(
                  `Selected candidate name ${JSON.stringify(candidate)} ` +
                  `was not found in the title or body of #${issueNumber}.`
                );
              }
            }

            if (validationErrors.length > 0) {
              core.setFailed(
                'Validation failed; no issues were changed:\n' +
                validationErrors.join('\n')
              );
              return;
            }

            const selectedIssues = openNominations.filter(
              issue => selectedByIssue.has(issue.number)
            );

            const notSelectedIssues = openNominations.filter(
              issue => !selectedByIssue.has(issue.number)
            );

            core.info(`Mode: ${dryRun ? 'DRY RUN' : 'LIVE'}`);
            core.info(`Open 2026 nomination issues: ${openNominations.length}`);
            core.info(`Selected: ${selectedIssues.length}`);
            core.info(`Not Selected: ${notSelectedIssues.length}`);
            core.info('Closed issues and unrelated issues will not be changed.');

            // Validate that the destination labels exist before any changes.
            const repositoryLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 }
            );

            const existingLabelNames = new Set(
              repositoryLabels.map(label => label.name)
            );

            for (const requiredLabel of ['Selected', 'Not Selected']) {
              if (!existingLabelNames.has(requiredLabel)) {
                core.setFailed(
                  `Required repository label ${JSON.stringify(requiredLabel)} ` +
                  'does not exist. Create it before running this workflow.'
                );
                return;
              }
            }

            // Fetch comment history before any modifications, so the
            // workflow can avoid posting the same decision comment twice.
            const plans = [];

            for (const issue of openNominations) {
              const isSelected = selectedByIssue.has(issue.number);
              const decision = isSelected ? 'Selected' : 'Not Selected';
              const desiredComment = isSelected
                ? selectedComment
                : notSelectedComment;

              const commentMarker = isSelected
                ? '<!-- ambassador-selected-2026 -->'
                : '<!-- ambassador-not-selected-2026 -->';

              const labels = new Set(
                issue.labels.map(label =>
                  typeof label === 'string' ? label : label.name
                )
              );

              const labelsToRemove = [
                reviewLabel,
                ...(isSelected
                  ? ['Not Selected', 'Not Accepted']
                  : ['Selected', 'Accepted'])
              ].filter(label => labels.has(label));

              const needsDecisionLabel = !labels.has(decision);

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100
                }
              );

              const needsComment = !comments.some(
                comment => (comment.body || '').includes(commentMarker)
              );

              plans.push({
                issue,
                decision,
                desiredComment,
                labelsToRemove,
                needsDecisionLabel,
                needsComment
              });
            }

            // Print the COMPLETE plan before making changes.
            for (const plan of plans) {
              const { issue, decision, labelsToRemove,
                      needsDecisionLabel, needsComment } = plan;

              core.info(`Processing #${issue.number} — ${issue.title}: ${decision}`);

              if (needsDecisionLabel) {
                core.info(
                  `${dryRun ? 'DRY RUN: Would add' : 'Will add'} ` +
                  `"${decision}" to #${issue.number}.`
                );
              }

              for (const label of labelsToRemove) {
                core.info(
                  `${dryRun ? 'DRY RUN: Would remove' : 'Will remove'} ` +
                  `"${label}" from #${issue.number}.`
                );
              }

              if (needsComment) {
                core.info(
                  `${dryRun ? 'DRY RUN: Would post' : 'Will post'} ` +
                  `the ${decision} comment on #${issue.number}.`
                );
              } else {
                core.info(
                  `Decision comment already exists on #${issue.number}; ` +
                  'no duplicate will be posted.'
                );
              }

              if (
                !needsDecisionLabel &&
                labelsToRemove.length === 0 &&
                !needsComment
              ) {
                core.info(`No changes needed for #${issue.number}.`);
              }
            }

            if (dryRun) {
              core.info(
                `Dry run complete: previewed ${selectedIssues.length} ` +
                `Selected and ${notSelectedIssues.length} Not Selected issues.`
              );
              core.info('No issues, labels, or comments were changed.');
              return;
            }

            // Apply changes only after the full validation and preview.
            for (const plan of plans) {
              const {
                issue,
                decision,
                desiredComment,
                labelsToRemove,
                needsDecisionLabel,
                needsComment
              } = plan;

              if (needsDecisionLabel) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [decision]
                });
              }

              for (const label of labelsToRemove) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: label
                });
              }

              if (needsComment) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: desiredComment
                });
              }

              core.info(`Completed #${issue.number}: ${decision}`);
            }

            core.info(
              `Finished: ${selectedIssues.length} Selected and ` +
              `${notSelectedIssues.length} Not Selected open nomination issues.`
            );
