name: Close Ambassador Applications

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Application year"
        type: string
        required: true
        default: "2026"
      dry_run:
        description: "Preview which issues will be closed"
        type: boolean
        required: true
        default: true

concurrency:
  group: close-ambassador-applications
  cancel-in-progress: false

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Preview or close application issues
        uses: actions/github-script@v7
        env:
          APPLICATION_YEAR: ${{ inputs.year }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const year = process.env.APPLICATION_YEAR.trim();
            const dryRun = process.env.DRY_RUN !== "false";

            if (!/^20\d{2}$/.test(year)) {
              core.setFailed("Enter a four-digit application year, such as 2026.");
              return;
            }

            const targetLabel = `ambassador-nomination-${year}`;
            const results = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: targetLabel,
              per_page: 100,
            });

            const applications = results.filter(issue => !issue.pull_request);
            core.info(`Found ${applications.length} open issues with label ${targetLabel}.`);

            for (const issue of applications) {
              if (dryRun) {
                core.info(`Would close #${issue.number}: ${issue.title}`);
                continue;
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });

              core.info(`Closed #${issue.number}: ${issue.title}`);
            }
