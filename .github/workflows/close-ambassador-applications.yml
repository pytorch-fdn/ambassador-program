name: Close Ambassador Applications 2026

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview which issues will be closed"
        type: boolean
        required: true
        default: true

concurrency:
  group: close-ambassador-applications-2026
  cancel-in-progress: false

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Preview or close 2026 application issues
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN !== "false";
            const targetLabel = "ambassador-nomination-2026";

            const results = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: targetLabel,
              per_page: 100,
            });

            const applications = results.filter(issue => !issue.pull_request);
            core.info(`Found ${applications.length} open 2026 application issues.`);

            for (const issue of applications) {
              if (dryRun) {
                core.info(`Would close #${issue.number}: ${issue.title}`);
                continue;
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });

              core.info(`Closed #${issue.number}: ${issue.title}`);
            }
